services:
  # PostgreSQL 16 Database
  bus.postgres:
    image: postgres:16-alpine
    container_name: bus.postgres
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres123}
      POSTGRES_DB: ${DATABASE_NAME:-bus_ticketing_db}
    ports:
      - "5432:5432"
    volumes:
      - bus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bus_ticketing_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  bus.redis:
    image: redis:7-alpine
    container_name: bus.redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis123}"]
    ports:
      - "6379:6379"
    volumes:
      - bus_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # RabbitMQ Message Broker
  bus.rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: bus.rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rabbitmq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbitmq123}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management UI
    volumes:
      - bus_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Kafka (KRaft mode)
  bus.kafka:
    image: apache/kafka:3.8.0
    container_name: bus.kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@bus.kafka:9093'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      KAFKA_LISTENERS: 'INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://bus.kafka:29092,EXTERNAL://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - bus_kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Kafka UI
  bus.kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: bus.kafka-ui
    ports:
      - "8081:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=LocalCluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=bus.kafka:29092
      - DYNAMIC_CONFIG_ENABLED=true
    depends_on:
      - bus.kafka
    restart: unless-stopped

  # MinIO Object Storage
  bus.minio:
    image: minio/minio:latest
    container_name: bus.minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    ports:
      - "9000:9000" # MinIO API
      - "9001:9001" # MinIO Console
    volumes:
      - bus_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # PGAdmin for Database Management
  bus.pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bus.pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bus.local
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "5050:5050"
    volumes:
      - bus_pgadmin_data:/var/lib/pgadmin
    depends_on:
      - bus.postgres
    restart: unless-stopped

  # Qdrant Vector Database (AI Agent)
  bus.qdrant:
    image: qdrant/qdrant:latest
    container_name: bus.qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC API
    volumes:
      - bus_qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # AI Agent Service (FastAPI + gRPC)
  bus.aiservice:
    build:
      context: ../aiservice
      dockerfile: Dockerfile
    container_name: bus.aiservice
    ports:
      - "8100:8100"   # FastAPI HTTP (Admin UI + REST API)
      - "50051:50051" # gRPC (Go backend → AI Agent)
    volumes:
      - bus_ai_data:/app/data
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      AI_SERVICE_PORT: 8100
      GRPC_PORT: 50051
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      QDRANT_HOST: bus.qdrant
      QDRANT_PORT: 6333
      REDIS_URI: redis://bus.redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      REDIS_DB: 1
      ADMIN_DB_PATH: /app/data/admin.db
      DEFAULT_GRPC_TARGET: bus.backend:50052
    depends_on:
      bus.qdrant:
        condition: service_healthy
      bus.redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  bus_postgres_data:
    name: bus_postgres_data
  bus_redis_data:
    name: bus_redis_data
  bus_rabbitmq_data:
    name: bus_rabbitmq_data
  bus_minio_data:
    name: bus_minio_data
  bus_pgadmin_data:
    name: bus_pgadmin_data
  bus_qdrant_data:
    name: bus_qdrant_data
  bus_ai_data:
    name: bus_ai_data
  bus_kafka_data:
    name: bus_kafka_data
