version: "3.9"

services:
  # ── Qdrant Vector Database ──
  qdrant:
    image: qdrant/qdrant:latest
    container_name: dadpt-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

  # ── Redis (AI Service — port 6380 to avoid conflict with Go backend) ──
  redis-ai:
    image: redis:7-alpine
    container_name: dadpt-redis-ai
    command: redis-server --requirepass redis123
    ports:
      - "6380:6379"
    volumes:
      - redis_ai_data:/data

  # ── AI Agent Service ──
  aiservice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dadpt-aiservice
    ports:
      - "8100:8100"   # FastAPI HTTP
      - "50051:50051"  # gRPC
    env_file:
      - .env
    environment:
      # Override hosts to point to docker service names
      QDRANT_HOST: qdrant
      REDIS_URI: redis://redis-ai:6379
      ADMIN_DB_PATH: /app/data/admin.db
    volumes:
      - aiservice_data:/app/data
    depends_on:
      - qdrant
      - redis-ai

volumes:
  qdrant_data:
  redis_ai_data:
  aiservice_data:
