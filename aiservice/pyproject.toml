[project]
name = "dadpt-ai-agent"
version = "0.1.0"
description = "BPMN-style Dynamic AI Agent Platform with multi-tenant, multi-model support"
requires-python = ">=3.11"
dependencies = [
    # === Web & gRPC ===
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "grpcio>=1.68.0",
    "grpcio-tools>=1.68.0",
    "grpcio-reflection>=1.68.0",

    # === LangChain ===
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-huggingface>=0.1.0",
    "aiohttp>=3.9.0",
    "langgraph>=0.2.0",

    # === Vector DB ===
    "qdrant-client>=1.12.0",

    # === Data Processing ===
    "polars>=1.0.0",

    # === Database (Admin config) ===
    "aiosqlite>=0.20.0",
    "sqlalchemy[asyncio]>=2.0.0",

    # === Templating & UI ===
    "jinja2>=3.1.0",
    "python-multipart>=0.0.12",

    # === Config & Security ===
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "cryptography>=43.0.0",

    # === Async ===
    "uvloop>=0.21.0; sys_platform != 'win32'",

    # === Logging ===
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
